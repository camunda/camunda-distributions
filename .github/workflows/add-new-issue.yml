name: Add new Issue

on:
  issues:
    types:
      - opened
      - transferred

jobs:
  add-to-project:
    permissions:
      id-token: write
    name: Add new issue
    runs-on: ubuntu-latest
    steps:
      - name: Create URL to the run output
        id: vars
        run: |
          echo "project_id=33" >> "$GITHUB_OUTPUT"
          echo "now=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: ${{ secrets.VAULT_JWT_ROLE }}
          path: ${{ secrets.VAULT_JWT_PATH }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/distribution/ci GH_APP_ID_DISTRO_CI;
            secret/data/products/distribution/ci GH_APP_PRIVATE_KEY_DISTRO_CI;
          exportEnv: true

      - name: Generate GitHub token
        # No PR job runs this workflow, so narrower token permissions stay unproven.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 # zizmor: ignore[github-app]
        id: generate-github-token
        with:
          app-id: ${{ env.GH_APP_ID_DISTRO_CI }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY_DISTRO_CI }}
      
      - name: Add to Distribution Team project
        uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/camunda/projects/33
          github-token: '${{ steps.generate-github-token.outputs.token }}'

      - name: Update Created At field
        uses: github/update-project-action@d0031a4f8081c4bf4438d7ce2fa5cf1136610c7a # main
        id: update-created-at
        with:
          github_token: ${{ steps.generate-github-token.outputs.token }}
          organization: ${{ github.repository_owner }}
          project_number: ${{ steps.vars.outputs.project_id }}
          content_id: ${{ github.event.issue.node_id }}
          field: Created At
          value: ${{ steps.vars.outputs.now }}

          
