identity:
  url: "http://localhost:8084"
  flags:
    multi-tenancy: "false"
    resource-permissions: "${RESOURCE_AUTHORIZATIONS_ENABLED:true}"

  authProvider:
    issuer-url: "http://${HOST}:18080/auth/realms/camunda-platform"
    backend-url: "http://${KEYCLOAK_HOST}:18080/auth/realms/camunda-platform"

  component-presets:
    connectors:
      applications:
        - name: Connectors
          id: connectors
          type: m2m
          secret: "${CONNECTORS_CLIENT_SECRET}"
          permissions:
            - audience: "orchestration-api"
              definition: read:*
    identity:
      apis:
        - name: "Camunda Identity Resource Server"
          audience: "camunda-identity-resource-server"
          permissions:
            - definition: read
              description: "Read permission"
            - definition: "read:users"
              description: "Read users permission"
            - definition: write
              description: "Write permission"
      roles:
        - name: "ManagementIdentity"
          description: "Provides full access to Identity"
          permissions:
            - audience: "camunda-identity-resource-server"
              definition: read
            - audience: "camunda-identity-resource-server"
              definition: write
    orchestration:
      applications:
        - name: Orchestration
          id: orchestration
          type: confidential
          secret: "${ORCHESTRATION_CLIENT_SECRET}"
          root-url: "http://localhost:8080"
          redirect-uris:
            - "/sso-callback"
      apis:
        - name: "Orchestration API"
          audience: "orchestration-api"
          permissions:
            - definition: read:*
              description: "Read permission"
            - definition: write:*
              description: "Write permission"
      roles:
        - name: "Orchestration"
          description: "Grants full access to Orchestration"
          permissions:
            - audience: "orchestration-api"
              definition: read:*
            - audience: "orchestration-api"
              definition: write:*
    optimize:
      applications:
        - name: Optimize
          id: optimize
          type: confidential
          secret: "${OPTIMIZE_CLIENT_SECRET}"
          root-url: "http://localhost:8083"
          redirect-uris:
            - "/api/authentication/callback"
          permissions:
            - audience: "optimize-api"
              definition: write:*
      apis:
        - name: Optimize API
          audience: "optimize-api"
          permissions:
            - definition: write:*
              description: "Write permission"
      roles:
        - name: "Optimize"
          description: "Grants full access to Optimize"
          permissions:
            - audience: "optimize-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
    webmodeler:
      applications:
        - name: "Hub"
          id: web-modeler
          type: public
          root-url: "http://localhost:8070"
          redirect-uris:
            - "/login-callback"
      apis:
        - name: Hub Internal API
          audience: "web-modeler-api"
          permissions:
            - definition: write:*
              description: "Write permission"
            - definition: admin:*
              description: "Admin permission"
            - definition: admin:clusters
              description: "Cluster management permission"
            - definition: admin:catalog
              description: "Catalog management permission"
            - definition: admin:bi
              description: "Business intelligence management permission"
        - name: Hub API
          audience: "web-modeler-public-api"
          permissions:
            - definition: create:*
              description: "Allows create access for all resources"
            - definition: read:*
              description: "Allows read access to all resources"
            - definition: update:*
              description: "Allows update access to all resources"
            - definition: delete:*
              description: "Allows delete access for all resources"
      roles:
        - name: "Web Modeler"
          description: "Grants full access to Hub"
          permissions:
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
        - name: "Web Modeler Admin"
          description: "Grants elevated access to Hub"
          permissions:
            - audience: "camunda-identity-resource-server"
              definition: read:users
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "web-modeler-api"
              definition: admin:*
        - name: "Hub"
          description: "Grants full access to Hub"
          permissions:
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
        - name: "Hub Admin"
          description: "Grants elevated access to Hub"
          permissions:
            - audience: "camunda-identity-resource-server"
              definition: read:users
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "web-modeler-api"
              definition: admin:*
        - name: "Analyst"
          description: "Grants full access to Optimize and to Hub. Additionally, grants management access to Hub's catalog and business intelligence features"
          permissions:
            - audience: "optimize-api"
              definition: write:*
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
            - audience: "web-modeler-api"
              definition: admin:catalog
            - audience: "web-modeler-api"
              definition: admin:bi
        - name: "Console"
          description: "Grants access to Hub's cluster management"
          permissions:
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
            - audience: "web-modeler-api"
              definition: admin:clusters
        - name: "DevOps"
          description: "Grants access to Hub's cluster management"
          permissions:
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
            - audience: "web-modeler-api"
              definition: admin:clusters

keycloak:
  url: "http://${KEYCLOAK_HOST}:18080/auth"
  setup:
    user: "${KEYCLOAK_ADMIN_USER:admin}"
    password: "${KEYCLOAK_ADMIN_PASSWORD}"
  init:
    orchestration:
      secret: "${ORCHESTRATION_CLIENT_SECRET}"
    optimize:
      secret: "${OPTIMIZE_CLIENT_SECRET}"
    connectors:
      secret: "${CONNECTORS_CLIENT_SECRET}"
    webmodeler:
      root-url: "http://localhost:8070"
  clients:
  environment:
    clients:
      - name: Identity
        id: "camunda-identity"
        type: CONFIDENTIAL
        secret: ${CAMUNDA_IDENTITY_CLIENT_SECRET:demo-identity-secret}
        root-url: "http://localhost:8084"
        redirect-uris:
          - "/auth/login-callback"
  users:
    - username: "demo"
      password: "demo"
      firstName: "Demo"
      lastName: "User"
      email: "demo@example.org"
      roles:
        - ManagementIdentity
        - Optimize
        - Hub
        - Hub Admin
        - DevOps
        - Analyst
        - Orchestration

server:
  port: 8084

spring:
  config:
    import: optional:file:/app/config/application-web-modeler.yaml
  profiles:
    active: keycloak
  datasource:
    url: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:keycloak}"
    username: "${POSTGRES_USER:keycloak}"
    password: "${POSTGRES_PASSWORD}"

management:
  endpoints:
    web:
      exposure:
        include: health,configprops
  endpoint:
    configprops:
      show-values: ALWAYS
    health:
      probes:
        enabled: true

camunda:
  identity:
    audience: "camunda-identity-resource-server"
